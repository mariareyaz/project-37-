<!DOCTYPE html>
<html>
<head>
    <title>AI Preterm Risk Predictor</title>
    <style>
        body {
            font-family: 'Segoe UI';
            background: linear-gradient(to right, #e3f2fd, #f5f7fa);
            text-align: center;
        }

        h1 {
            margin-top: 30px;
            color: #2c3e50;
        }

        p {
            color: gray;
        }

        .container {
            width: 420px;
            margin: auto;
            margin-top: 30px;
            padding: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background: #007BFF;
            color: white;
            padding: 12px;
            border: none;
            width: 100%;
            border-radius: 5px;
            font-size: 16px;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

<h1>🏥 AI-Based Preterm Birth Risk Predictor</h1>
<p>Early detection using maternal clinical indicators</p>

<div class="container">

    <form action="/predict" method="post">

        <input type="number" name="age" placeholder="Age" required>
        <input type="number" name="gestation" placeholder="Gestation Weeks" required>
        <input type="number" name="bp" placeholder="Blood Pressure" required>
        <input type="number" step="0.1" name="temp" placeholder="Temperature (°C)" required>
        <input type="number" name="hb" placeholder="Hemoglobin (g/dL)" required>
        <input type="number" name="wbc" placeholder="WBC Count" required>
        <input type="number" name="hr" placeholder="Heart Rate (bpm)" required>
        <input type="number" name="crp" placeholder="CRP Level" required>

        <button type="submit">🔍 Analyze Risk</button>

    </form>

</div>

</body>
</html>
